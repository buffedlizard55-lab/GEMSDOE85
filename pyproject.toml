[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gems85"
version = "1.0.0"
description = "GEMSDOE85 — Lane H85-TVFV: Terzaghi-Vector Fault-Valve & 90deg-Corrected Multi-Scale Curvilinear Dipole Synthesis for DOE GEMS Prize #306"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src", "vendor"]
