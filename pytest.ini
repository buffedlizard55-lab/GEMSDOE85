[pytest]
# Both lanes' suites run here. `scripts/duplex_lane` precedes `scripts` so the duplex lane's
# tests resolve `import build_site` to their own builder; this lane invokes its scripts by path
# (`python scripts/build_site.py`), so the shadowing is harmless.
pythonpath = src vendor scripts/duplex_lane scripts .
testpaths = tests
addopts = -q
