name: Evidence and contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - name: Check generated site is reproducible
        run: git diff --exit-code -- docs index.html
